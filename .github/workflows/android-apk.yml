      - name: Setup Android SDK - FIXED
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q -o cmdline.zip
          ls -la
          # FIX: zip contains cmdline-tools folder, not cmdline
          if [ -d cmdline-tools ]; then
            rm -rf latest || true
            mv cmdline-tools latest
          elif [ -d cmdline ]; then
            rm -rf latest || true
            mv cmdline latest
          else
            mkdir -p latest
            mv bin lib NOTICE.txt source.properties latest/ 2>/dev/null || true
          fi
          ls -la latest/bin/ | head -10
          
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
